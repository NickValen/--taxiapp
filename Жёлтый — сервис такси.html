<style>

.cc{pointer-events:auto;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .25s,box-shadow .25s;box-shadow:0 6px 20px rgba(60,40,20,.12);animation:rise .6s both}

button{font:inherit;color:inherit;cursor:pointer}

.panel{position:absolute;left:16px;top:16px;width:360px;max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 28px rgba(60,40,20,.16)}
#pb{padding:22px;overflow:auto;flex:1;min-height:0}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;padding:12px 2px;font:700 11.5px Manrope,sans-serif;color:var(--mut);border-top:3px solid transparent}

h3{font:700 14px Manrope,sans-serif;margin:14px 0 6px}

.rs{display:flex;gap:4px;margin:8px 0}
.st{background:none;border:0;font-size:28px;line-height:1;color:var(--line);padding:2px}.st.on{color:var(--accent)}

.chat{display:flex;flex-direction:column;gap:6px;margin:8px 0}

.toast{position:absolute;top:58px;left:50%;transform:translate(-50%,-10px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s;max-width:90%;z-index:5}

h1{font:600 26px Unbounded,sans-serif;margin:0 0 6px;letter-spacing:-.02em}
h2{font:600 18px Unbounded,sans-serif;margin:14px 0 8px;letter-spacing:-.01em}

.tfs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tf{background:none;border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;gap:2px;align-items:center}
.tf span{font-weight:700;color:var(--mut);font-size:14px}

.go{width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:#2E2A3B;font:700 16px Manrope,sans-serif}

.lnk{display:block;margin:12px auto 0;background:none;border:0;color:var(--mut);text-decoration:underline;font-size:14px}
.drv{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#2E2A3B;display:grid;place-items:center;font:600 18px Unbounded,sans-serif}
.drv small{color:var(--mut);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.bar.ind i{width:35%;animation:slide 1.2s ease-in-out infinite alternate}

.price{font:600 22px Unbounded,sans-serif;margin:6px 0 14px}
@media (max-width:760px){
.panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:46%;border-radius:22px 22px 0 0}#pb{padding:18px}
.hud{left:12px;justify-content:flex-start}.zoom{bottom:calc(46% + 12px)}
h1{font-size:22px}
}
</style>
</head>

function spl(P,st=.3){const o=[];for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)],n=Math.max(2,Math.ceil(hyp(p2[0]-p1[0],p2[1]-p1[1])/st));for(let k=0;k<=(i===P.length-2?n:n-1);k++){const t=k/n,t2=t*t,t3=t2*t;o.push([0,1].map(c=>.5*(2*p1[c]+(-p0[c]+p2[c])*t+(2*p0[c]-5*p1[c]+4*p2[c]-p3[c])*t2+(-p0[c]+3*p1[c]-3*p2[c]+p3[c])*t3)))}}return o}

function urban(rn,s){const R=[],Wt=s.water||[],nm=s.nm,ex=(s.ex||[]).concat((s.rb||[]).map(([x,y,,,l])=>[x,y,l*.8]));
 const dsg=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1)));return hyp(p[0]-a[0]-dx*t,p[1]-a[1]-dy*t)};

 cx.fillStyle='#5f8f57';cx.globalAlpha=.6;cx.beginPath();for(const[x,y]of C.trees){const[a,b]=P(x,y);cx.moveTo(a+S*.07,b);cx.arc(a,b,S*.07,0,7)}cx.fill();

function draw(t,dt){

 if(o&&o.car&&(o.phase==='pick'||o.phase==='board')){const c=o.car;cx.strokeStyle=css.ink;cx.globalAlpha=.45;cx.lineWidth=4;line([[c.x,c.y],...c.path],[2,9]);cx.globalAlpha=.25;line([o.pick,...route(o.pick,o.drop,o.v)]);cx.globalAlpha=1}

function step(c,dt){let d=c.speed*dt;while(d>0&&c.path.length){const q=c.path[0],dx=q[0]-c.x,dy=q[1]-c.y,L=Math.hypot(dx,dy);if(L<=d){c.x=q[0];c.y=q[1];c.n=q;c.path.shift();d-=L}else{c.x+=dx/L*d;c.y+=dy/L*d;c.a=Math.atan2(dy,dx);d=0}}}

function legsOf(a,b){const P=[a,...route(a,b)],R=[];let i=1;
 while(i<P.length){const e0=EM.get(ek(P[i-1][2],P[i][2]));let j=i,len=0,m=1;
  while(j<P.length){const e=EM.get(ek(P[j-1][2],P[j][2]));if(j>i&&e.k!==e0.k)break;len+=e.l;m=Math.max(m,e.f);j++}
  R.push({n:e0.n,len,m,end:P[j-1][2]});i=j}
 const M=[];let pd=null;R.forEach((r,k)=>{if(pd){r.len+=pd.len;r.m=Math.max(r.m,pd.m);pd=null}if(r.len<.4&&k<R.length-1)pd=r;else M.push(r)});

function tick(dt){
 for(const c of cars){c.speed=(c.state==='free'?.35:.45)/segF(c);
  if(c.state==='board'){c.hold-=dt;if(c.hold<=0){const o=c.order;c.state='trip';c.path=route(c.n,o.drop);o.phase='trip';o.tot=Math.max(1,len(c));if(!o.bot)refresh()}continue}
  if(c.state==='free'&&!c.path.length)c.path=route(c.n,rndNode());
  step(c,dt);
  if(!c.path.length){const o=c.order;
   if(c.state==='pick'){c.state='board';c.hold=o.bot?1.5:4;o.phase='board';if(!o.bot)refresh()}
   else if(c.state==='trip'){c.state='free';c.order=null;if(!o.bot){o.phase='done';o.h={a:o.pick,b:o.drop,p:o.price,r:0,d:'сегодня',la:label(o.pick),lb:label(o.drop),c:CITY.n};hist.unshift(o.h);refresh()}}}}
 botT+=dt;if(botT>(rush?1.1:5)){botT=0;spawnBot()}
 const o=ui.order;if(o&&o.phase==='search'){o.wait+=dt;if(o.wait>1.4&&dispatch(o))refresh()}}

 else if(o.phase==='search'){g('nt').textContent=o.wait>4?'Все машины заняты — продолжаем искать':'Подбираем ближайшую машину'}

  g('eta').textContent=ph==='pick'?`Водитель приедет через ${mins(r)} мин`:ph==='board'?'Водитель на месте — садитесь':`${mins(r)} мин до места`;

function setPoint(n){if(ui.order||!n)return;if(!ui.pick||ui.drop){ui.pick=n;ui.drop=null}else if(man(n,ui.pick)>=4&&route(ui.pick,n).length)ui.drop=n;render()}
function focus(n){cam.z=1.8;cam.x=rc.x-(ox+n[0]*S)*cam.z;cam.y=rc.y-(oy+n[1]*S)*cam.z}
function zoomAt(px,py,f){const nz=Math.min(3.5,Math.max(.7,cam.z*f));f=nz/cam.z;cam.x=px-(px-cam.x)*f;cam.y=py-(py-cam.y)*f;cam.z=nz}
const world=e=>{const r=cv.getBoundingClientRect();return[((e.clientX-r.left-cam.x)/cam.z-ox)/S,((e.clientY-r.top-cam.y)/cam.z-oy)/S]};
const hit=(wx,wy)=>POIS.find(q=>hyp(q.x-wx,q.y-wy)<(q.m?.3:.5))||STOPS.find(q=>hyp(q.x+.12-wx,q.y-.12-wy)<.28);
const nodeAt=(x,y)=>{let b=null,bd=1;for(const n of CITY.nl){const d=hyp(n[0]-x,n[1]-y);if(d<bd){bd=d;b=n}}return b};
const ptr=new Map();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);drag=0});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),tip=$('#tip');
 if(ptr.has(e.pointerId)){const o=ptr.get(e.pointerId),n=[e.clientX,e.clientY];
  if(ptr.size===1){drag+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);if(drag>6){cam.x+=n[0]-o[0];cam.y+=n[1]-o[1]}}
  else{const q=[...ptr].find(([k])=>k!==e.pointerId)[1];drag=99;zoomAt((n[0]+q[0])/2-r.left,(n[1]+q[1])/2-r.top,Math.hypot(n[0]-q[0],n[1]-q[1])/Math.hypot(o[0]-q[0],o[1]-q[1]))}
  ptr.set(e.pointerId,n);tip.style.display='none'}
 else{const w=world(e),h=hit(w[0],w[1]);if(h){tip.textContent=h.e+' '+h.n;tip.style.left=e.clientX-r.left+14+'px';tip.style.top=e.clientY-r.top+14+'px';tip.style.display='block'}else tip.style.display='none'}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>ptr.delete(e.pointerId)));
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15)},{passive:false});
$('#zi').onclick=()=>zoomAt(rc.x,rc.y,1.3);$('#zo').onclick=()=>zoomAt(rc.x,rc.y,1/1.3);$('#zr').onclick=()=>{cam={z:1,x:0,y:0}};
cv.addEventListener('click',e=>{if(drag>6)return;if(ui.page!=='home'){ui.page='home';render()}if(ui.order)return;const w=world(e),h=hit(w[0],w[1]);setPoint(h?h.nd:nodeAt(w[0],w[1]))});

addEventListener('resize',resize);


let menuOpen=true,mp={x:0,y:0,sx:0,sy:0,px:-999,py:-999},clouds=[],balloons=[],sparks=[],thumbs=[];
function initCity(k){const c=CITIES[k];CITY=c;cityIdx=k;POIS=c.POIS;STOPS=c.STOPS;EM=c.em;NAMED=new Map([...POIS,...STOPS].map(p=>[p.nd[2],p.n]));
 ui.order=null;ui.pick=ui.drop=null;ui.page='home';ui.ph=null;makeCars();cam={z:1,x:0,y:0};botT=0;resize();render();for(let i=0;i<3;i++)spawnBot();$('#cities').textContent='📍 '+c.n}
function thumb(cv2,c){const g=cv2.getContext('2d'),s=240/22,X=x=>x*s,Y=y=>y*s;g.clearRect(0,0,240,150);
 const gr=g.createLinearGradient(0,0,0,150);gr.addColorStop(0,css.s1);gr.addColorStop(1,css.s3);g.fillStyle=gr;g.fillRect(0,0,240,150);
 g.save();g.beginPath();c.tile.forEach((q,i)=>i?g.lineTo(X(q[0]),Y(q[1])):g.moveTo(X(q[0]),Y(q[1])));g.closePath();g.fillStyle=css.block;g.fill();g.clip();g.lineCap='round';g.lineJoin='round';
 for(const[pts,w]of c.water){g.beginPath();pts.forEach((q,i)=>i?g.lineTo(X(q[0]),Y(q[1])):g.moveTo(X(q[0]),Y(q[1])));g.strokeStyle=css.water;g.lineWidth=w*s;g.stroke()}
 g.fillStyle=css.park;c.parks.forEach(([x,y,rx,ry])=>{g.beginPath();g.ellipse(X(x),Y(y),rx*s,ry*s,0,0,7);g.fill()});
 const P2=(L,w,col)=>{g.beginPath();for(const e of L){const a=c.N[e.a],b=c.N[e.b];g.moveTo(X(a[0]),Y(a[1]));g.lineTo(X(b[0]),Y(b[1]))}g.strokeStyle=col;g.lineWidth=w;g.stroke()};
 P2(c.e2,s*.1,css.ink);P2(c.e1,s*.2,css.ink);P2(c.tm,s*.1,'#f0a93b');P2(c.th,s*.12,'#d9453a');g.restore()}
function buildMenu(){const c=$('#cards');
 c.innerHTML=CITIES.map((x,k)=>`<button class="cc" data-city="${k}" style="animation-delay:${k*.08}s"><canvas width="240" height="150"></canvas><b>${x.e} ${x.n}</b><small>${x.d}</small><span>${x.POIS.length} мест · пробок: ${x.nTraf} · перекрыто: ${x.closedE.length}</span></button>`).join('');
 thumbs=[...c.querySelectorAll('canvas')];
 clouds=Array.from({length:10},(_,i)=>({x:Math.random(),y:.06+Math.random()*.55,s:.6+Math.random()*.9,v:.004+Math.random()*.008,l:i%3,sq:0,ox:0,oy:0,px:0,py:0,r:30})).sort((a,b)=>a.l-b.l);
 balloons=[{x:.14,y:.42,c:'#F2A65A',t:0,b:0,px:0,py:0},{x:.86,y:.3,c:'#8E6BB0',t:2,b:0,px:0,py:0}];
 c.onclick=e=>{const b=e.target.closest('[data-city]');if(b)openCity(+b.dataset.city)};
 $('#cont').onclick=()=>{mp.px=mp.py=-999;mp.x=mp.y=0;menuOpen=false;$('#menu').style.display='none'};
 const M=$('#menu');
 M.addEventListener('pointermove',e=>{mp.x=e.clientX/innerWidth*2-1;mp.y=e.clientY/innerHeight*2-1;mp.px=e.clientX;mp.py=e.clientY});
 M.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;let h=0;
  for(const c2 of clouds)if(Math.hypot(e.clientX-c2.px,e.clientY-c2.py)<c2.r*1.7){c2.sq=1;boom(c2.px,c2.py);h=1}
  for(const b of balloons)if(Math.hypot(e.clientX-b.px,e.clientY-b.py)<40){b.b=140;boom(b.px,b.py);h=1}
  if(!h)boom(e.clientX,e.clientY)})}
const boom=(x,y)=>{for(let i=0;i<12;i++){const a=Math.random()*6.28,v=40+Math.random()*100;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,l:1})}};
function openCity(k){initCity(k);started=true;mp.px=mp.py=-999;mp.x=mp.y=0;menuOpen=false;$('#menu').style.display='none';toast('Добро пожаловать: '+CITIES[k].n)}
function showMenu(){menuOpen=true;$('#menu').style.display='block';$('#cont').style.display=started?'block':'none';thumbs.forEach((t,k)=>thumb(t,CITIES[k]))}
$('#cities').onclick=showMenu;
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.4+.4,p:Math.random()*6}));
function drawSky(g,w,h,T,dt){const dk=isDark(),gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,css.s1);gr.addColorStop(.55,css.s2);gr.addColorStop(1,css.s3);g.globalAlpha=1;g.fillStyle=gr;g.fillRect(0,0,w,h);
 mp.sx+=(mp.x-mp.sx)*.06;mp.sy+=(mp.y-mp.sy)*.06;
 if(dk)for(const s of stars){g.globalAlpha=.35+.5*Math.abs(Math.sin(T*.8+s.p));g.fillStyle='#F3E9DC';g.beginPath();g.arc(s.x*w-mp.sx*6,s.y*h,s.r,0,7);g.fill()}
 g.globalAlpha=1;const sx=w*.78-mp.sx*18,sy=h*.17-mp.sy*10,r=Math.min(w,h)*.06;
 if(dk){const gl=g.createRadialGradient(sx,sy,r*.8,sx,sy,r*3);gl.addColorStop(0,'rgba(243,233,220,.35)');gl.addColorStop(1,'rgba(243,233,220,0)');g.fillStyle=gl;g.beginPath();g.arc(sx,sy,r*3,0,7);g.fill();
  g.fillStyle='#F3E9DC';g.beginPath();g.arc(sx,sy,r,0,7);g.fill();g.fillStyle='rgba(120,100,140,.25)';[[-.3,-.2,.22],[.25,.15,.3],[-.1,.4,.15]].forEach(([a,b,m])=>{g.beginPath();g.arc(sx+a*r,sy+b*r,m*r,0,7);g.fill()})}
 else{g.save();g.translate(sx,sy);g.rotate(T*.1);g.fillStyle=css.accent;g.globalAlpha=.35;for(let i=0;i<12;i++){g.rotate(PI/6);g.fillRect(r*1.3,-3,r*.7,6)}g.restore();g.globalAlpha=1;g.fillStyle=css.accent;g.beginPath();g.arc(sx,sy,r,0,7);g.fill()}
 for(const c of clouds){c.x+=c.v*dt;if(c.x>1.25)c.x=-.25;c.ox*=.94;c.oy*=.94;
  const px=c.x*w-mp.sx*(10+c.l*16)+c.ox,py=c.y*h-mp.sy*(6+c.l*10)+c.oy,r2=24*c.s*(1+c.l*.25),dx=px-mp.px,dy=py-mp.py,dd=hyp(dx,dy);
  if(dd<150&&dd>1){c.ox+=dx/dd*(150-dd)*.03;c.oy+=dy/dd*(150-dd)*.02}
  c.px=px;c.py=py;c.r=r2;c.sq*=.95;const sc=1+c.sq*.3*Math.sin(T*16),pas=dk?[['#6a5585',.45,-.12,-.16],[css.cl,.88,0,0]]:[[css.cl,.6+c.l*.13,0,0]];
  for(const[col,al,ax,ay]of pas){g.save();g.translate(px+ax*r2,py+ay*r2);g.scale(sc,2-sc);g.globalAlpha=al;g.fillStyle=col;g.beginPath();
   [[0,0,1],[.9,-.3,.8],[-.9,0,.7],[1.7,.1,.55],[-1.6,.2,.5]].forEach(([a,b,m])=>{g.moveTo(a*r2+m*r2,b*r2);g.arc(a*r2,b*r2,m*r2,0,7)});g.fill();g.restore()}}
 g.globalAlpha=1}
function sky(t,dt){const k=$('#sky'),d=devicePixelRatio||1,w=k.clientWidth,h=k.clientHeight;if(k.width!==(w*d|0)){k.width=w*d;k.height=h*d}
 const g=k.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);drawSky(g,w,h,t/1000,dt);const T=t/1000;
 for(let l=0;l<3;l++){g.fillStyle=css.park;g.globalAlpha=.3+.22*l;g.beginPath();g.moveTo(0,h);const y0=h*(.78+l*.07);for(let x=0;x<=w+12;x+=12)g.lineTo(x,y0+Math.sin(x*.004*(1+l*.5)+l*2+mp.sx*.4)*h*.035-mp.sx*(4+l*6));g.lineTo(w,h);g.fill()}
 g.globalAlpha=1;
 for(const b of balloons){b.t+=dt;b.b*=.97;const x=b.x*w-mp.sx*22+Math.sin(T*.5+b.t)*14,y=b.y*h-mp.sy*12+Math.sin(T*.9+b.t)*10-b.b;b.px=x;b.py=y;
  g.fillStyle=b.c;g.beginPath();g.ellipse(x,y,22,28,0,0,7);g.fill();g.fillStyle=css.accent;g.globalAlpha=.7;g.beginPath();g.ellipse(x,y,8,28,0,0,7);g.fill();g.globalAlpha=1;
  g.strokeStyle=css.ink;g.lineWidth=1;g.beginPath();g.moveTo(x-14,y+22);g.lineTo(x-6,y+38);g.moveTo(x+14,y+22);g.lineTo(x+6,y+38);g.stroke();g.fillStyle=css.ink;g.fillRect(x-7,y+38,14,9)}
 for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.l-=dt*1.3;if(p.l<=0){sparks.splice(i,1);continue}p.vy+=90*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;g.globalAlpha=p.l;g.fillStyle=css.accent;g.beginPath();g.arc(p.x,p.y,2+p.l*3,0,7);g.fill()}
 g.globalAlpha=1}
